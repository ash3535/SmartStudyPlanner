<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <h1>📊 Study Dashboard</h1>

    <div class="dashboard">

        <div class="card">
            <h3>Total Tasks</h3>
            <div class="number">
                {{ statistics[0] }}
            </div>
        </div>

        <div class="card">
            <h3>Total Study Hours</h3>
            <div class="number">
                {{ statistics[1] }}
            </div>
        </div>

        <div class="card">
            <h3>High Priority</h3>
            <div class="number">
                {{ statistics[2] }}
            </div>
        </div>

        <div class="card">
            <h3>Completed</h3>
            <div class="number">
                {{ statistics[3] }}
            </div>
        </div>

    </div>

    <a href="/">← Back to Tasks</a>

</body>

</html>
